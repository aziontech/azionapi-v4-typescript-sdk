name: Clean SDK Directory

on:
  workflow_dispatch:
    inputs:
      directory_path:
        description: 'Directory path to delete (relative to repo root)'
        required: true
        type: string

permissions: {}

jobs:
  clean-directory:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the directory removal to main
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Delete directory
        env:
          DIRECTORY_PATH: ${{ inputs.directory_path }}
        run: |
          if [ -d "$DIRECTORY_PATH" ]; then
            rm -rf "$DIRECTORY_PATH"
            echo "Directory $DIRECTORY_PATH deleted successfully"
          else
            echo "Directory $DIRECTORY_PATH does not exist"
            exit 1
          fi

      - name: Commit and push changes
        env:
          DIRECTORY_PATH: ${{ inputs.directory_path }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean SDK directory $DIRECTORY_PATH"
          git push origin main
