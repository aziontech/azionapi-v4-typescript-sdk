name: Generate SDK for Changed YAML Files

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  generate-sdk:
    # Only same-repo PRs: this job pushes to a base-repo branch named after
    # head.ref, which is meaningless (or wrong) for a fork's head branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # pushes the generated SDK to the PR head branch
    runs-on: ubuntu-latest
    outputs:
      run_sdk: ${{ steps.find-yaml.outputs.run_sdk }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact commit that triggered the event, not the branch
          # pointer: head.ref resolves at run time and can advance mid-run,
          # letting content bypass the commit-message gate below.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check if Commit Message Matches
        id: check-commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The commit message is attacker-controlled, so it never leaves this
          # step: it stays in a shell variable and only a boolean is exported.
          COMMIT_MSG=$(git log --format=%B -n 1 "$HEAD_SHA")
          echo "Commit message -> $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"chore: updated YAML files"* ]]; then
            echo "run_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Commit message does not match. Skipping workflow."
            echo "run_commit=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Find Modified Spec
        id: find-yaml
        if: steps.check-commit.outputs.run_commit == 'true'
        run: |
          git fetch origin main

          # This repo publishes a single package, so the only spec that drives
          # generation is the root azion-api.yaml (or an openapi.yaml dropped in
          # its place, which is renamed below).
          CHANGED=$(git diff --name-only origin/main HEAD -- azion-api.yaml openapi.yaml)

          if [ -z "$CHANGED" ]; then
            echo "::warning::azion-api.yaml not modified. Skipping SDK generation."
            echo "run_sdk=false" >> "$GITHUB_OUTPUT"
          else
            echo "Modified spec: $CHANGED"
            echo "run_sdk=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Rename openapi.yaml to azion-api.yaml
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: |
          if [ -f openapi.yaml ]; then
            echo "Renaming openapi.yaml -> azion-api.yaml"
            mv -f openapi.yaml azion-api.yaml
          fi
        shell: bash

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.find-yaml.outputs.run_sdk == 'true'
        with:
          node-version: 22 # openapi-generator-cli 2.40.x requires node >= 22

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.find-yaml.outputs.run_sdk == 'true'
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install OpenAPI Generator
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: npm install @openapitools/openapi-generator-cli@2.40.1 -g
        shell: bash

      - name: Run OpenAPI Generator
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: |
          # The published version comes from the release tag (release.yaml), so
          # keep whatever version is on disk to avoid churn in package.json.
          CURRENT_VERSION=$(node -p "require('./azion-api/package.json').version")

          openapi-generator-cli generate -i azion-api.yaml -g typescript -o ./azion-api \
            -t templates/typescript \
            --git-user-id aziontech --git-repo-id azionapi-v4-typescript-sdk \
            --additional-properties=npmName=@aziontech/azion-api-v4-sdk,npmVersion=${CURRENT_VERSION},licenseName=MIT,disallowAdditionalPropertiesIfNotPresent=false
        shell: bash

      - name: Update Lockfile and Build
        if: steps.find-yaml.outputs.run_sdk == 'true'
        working-directory: azion-api
        run: |
          # Pushes made with GITHUB_TOKEN don't trigger ci.yml, so the generated
          # code has to compile here before it is committed.
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
        shell: bash

      - name: Commit and Push Generated SDK
        if: steps.find-yaml.outputs.run_sdk == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff-index --quiet HEAD --; then
            echo "::warning::No SDK changes to commit."
          else
            git commit -m "chore: regenerate sdk from azion-api.yaml"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
        shell: bash

  notify-slack:
    # Separate job so the webhook is never present in a runner that has checked
    # out and executed PR-controlled content.
    needs: generate-sdk
    if: needs.generate-sdk.outputs.run_sdk == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

          # Commit message with the PR URL
          COMMIT_MESSAGE="New SDK generated and committed by GitHub Actions. View the PR here: ${PR_URL}"

          # Prepare Slack message payload with the escaped commit message
          PAYLOAD=$(echo "{\"attachments\":[{\"color\":\"#00008B\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*[GitHub Action] New STAGE SDK generated and committed!*\\nDetail: ${COMMIT_MESSAGE}\"}}]}]}")

          # Send the Slack message with a timeout
          if RESPONSE=$(curl -sS -X POST "${SLACK_WEBHOOK_URL}" -H "Content-Type: application/json" -H "Accept: application/json" --data "${PAYLOAD}" --max-time 15); then
            echo "[Slack-Notify] Slack response: ${RESPONSE}"
          else
            echo "[Slack-Notify] Failed to notify Slack!"
          fi
        shell: bash
