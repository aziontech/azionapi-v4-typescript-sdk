name: Generate SDK for Changed YAML Files

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  generate-sdk:
    # Only same-repo PRs: this job pushes to a base-repo branch named after
    # head.ref, which is meaningless (or wrong) for a fork's head branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # pushes generated SDKs to the PR head branch
    runs-on: ubuntu-latest
    outputs:
      run_sdk: ${{ steps.find-yaml.outputs.run_sdk }}
    container:
      # Pinned by digest: a mutable tag in the repo's only contents: write job
      # is a supply-chain hole. Refresh with:
      #   docker buildx imagetools inspect ubuntu:22.04
      image: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc # 22.04

    steps:
      - name: Setup Env
        run: apt-get update && apt-get install -y npm curl git
        shell: bash

      - name: Install GH CLI
        # Pinned release + sha256 verification instead of adding an unverified
        # keyring and a floating apt source to a contents: write job.
        env:
          GH_VERSION: '2.98.0'
          GH_SHA256_AMD64: 'f65a3fa2fa0eb2e97c445ee3f5e087a40aae03b64847f45a8f13805e504535d6'
          GH_SHA256_ARM64: 'bbc4ac7964c2a091fd555cd1758d10a7cfcfdc472e405f0b0fb958f05d535cb6'
        run: |
          set -euo pipefail
          ARCH=$(dpkg --print-architecture)
          case "$ARCH" in
            amd64) EXPECTED="$GH_SHA256_AMD64" ;;
            arm64) EXPECTED="$GH_SHA256_ARM64" ;;
            *) echo "::error::unsupported architecture $ARCH"; exit 1 ;;
          esac
          DEB="gh_${GH_VERSION}_linux_${ARCH}.deb"
          curl -fsSL -o "/tmp/${DEB}" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${DEB}"
          echo "${EXPECTED}  /tmp/${DEB}" | sha256sum -c -
          apt-get install -y "/tmp/${DEB}"
        shell: bash

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact commit that triggered the event, not the branch
          # pointer: head.ref resolves at run time and can advance mid-run,
          # letting content bypass the commit-message gate below.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: run safe dir
        run: git config --global --add safe.directory /__w/azionapi-v4-typescript-sdk/azionapi-v4-typescript-sdk

      - name: Check if Commit Message Matches
        id: check-commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The commit message is attacker-controlled, so it never leaves this
          # step: it stays in a shell variable and only a boolean is exported.
          COMMIT_MSG=$(git log --format=%B -n 1 "$HEAD_SHA")
          echo "Commit message -> $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"chore: updated YAML files"* ]]; then
            echo "run_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Commit message does not match. Skipping workflow."
            echo "run_commit=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Find Modified YAML Files
        id: find-yaml
        if: steps.check-commit.outputs.run_commit == 'true'
        run: |
          # Fetch all branches to make sure origin/main is available
          git fetch origin main
        
          YAML_FILES=$(git diff --name-only origin/main HEAD | grep -E '\.yaml$' | grep -v '/api/openapi\.yaml$' || echo "")

          if [ -z "$YAML_FILES" ]; then
            echo "::warning::No YAML files modified. Skipping SDK generation."
            echo "run_sdk=false" >> $GITHUB_OUTPUT
          else
            echo "Modified YAML files: $YAML_FILES"
            echo "run_sdk=true" >> $GITHUB_OUTPUT
            echo "$YAML_FILES" > yaml_files_list.txt
          fi
        shell: bash

      - name: Install OpenAPI Generator
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: npm install @openapitools/openapi-generator-cli@2.40.1 -g
        shell: bash

      - name: Rename openapi.yaml to azion-api.yaml
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: |
          temp_file=$(mktemp)
          while IFS= read -r file; do
            filename=$(basename "$file")
            if [ "$filename" = "openapi.yaml" ]; then
              dir=$(dirname "$file")
              if [ "$dir" = "." ]; then
                new_file="azion-api.yaml"
              else
                new_file="${dir}/azion-api.yaml"
              fi
              echo "Renaming $file -> $new_file"
              mv "$file" "$new_file"
              echo "$new_file" >> "$temp_file"
            else
              echo "$file" >> "$temp_file"
            fi
          done < yaml_files_list.txt
          mv "$temp_file" yaml_files_list.txt
          echo "Updated yaml_files_list.txt contents:"
          cat yaml_files_list.txt
        shell: bash

      - name: Run OpenAPI Generator for Changed Files
        if: steps.find-yaml.outputs.run_sdk == 'true'
        run: |
          while IFS= read -r file; do
            removed=$(echo ${file} | cut -d. -f1)
            pkg_name=$(echo ${removed} | tr -d '-')
            npx @openapitools/openapi-generator-cli@2.40.1 generate -i "$file" -g go -o "./${removed}" --package-name "${pkg_name}"

            echo 'go.mod' >> ./${removed}/.gitignore
            echo 'go.sum' >> ./${removed}/.gitignore
            echo 'api/openapi.yaml' >> ./${removed}/.gitignore
          done < yaml_files_list.txt

      - name: Commit and Push Generated SDKs
        if: steps.find-yaml.outputs.run_sdk == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          while IFS= read -r file; do
            git rm -f "$file"
          done < yaml_files_list.txt

          if git diff-index --quiet HEAD --; then
            echo "::warning::No SDK changes to commit."
          else
            git commit -m "Auto-generated SDKs for YAML files"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi

  notify-slack:
    # Separate job so the webhook is never present in a runner that has checked
    # out and executed PR-controlled content.
    needs: generate-sdk
    if: needs.generate-sdk.outputs.run_sdk == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

          # Commit message with the PR URL
          COMMIT_MESSAGE="New SDK generated and committed by GitHub Actions. View the PR here: ${PR_URL}"

          # Prepare Slack message payload with the escaped commit message
          PAYLOAD=$(echo "{\"attachments\":[{\"color\":\"#00008B\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*[GitHub Action] New STAGE SDK generated and committed!*\\nDetail: ${COMMIT_MESSAGE}\"}}]}]}")

          # Send the Slack message with a timeout
          if RESPONSE=$(curl -sS -X POST "${SLACK_WEBHOOK_URL}" -H "Content-Type: application/json" -H "Accept: application/json" --data "${PAYLOAD}" --max-time 15); then
            echo "[Slack-Notify] Slack response: ${RESPONSE}"
          else
            echo "[Slack-Notify] Failed to notify Slack!"
          fi
        shell: bash
